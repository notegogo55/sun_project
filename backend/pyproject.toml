[project]
name = "sunseg"
version = "0.1.0"
description = "Solar active region segmentation/tracking (U-Net) + GOES flare forecasting (LSTM)"
readme = "../README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyarrow>=15.0",
    "scikit-learn>=1.4",
    "opencv-python>=4.9",
    "matplotlib>=3.8",
    "astropy>=6.0",
    "sunpy[net,map,timeseries]>=5.1",
    "drms>=0.7",
    "zeep>=4.2",
    "reproject>=0.13",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "tensorboard>=2.16",
    "Pillow>=10.2",
]

[project.optional-dependencies]
# httpx จำเป็นสำหรับ starlette.testclient (ใช้ใน tests/test_app_smoke.py)
# starlette เวอร์ชันใหม่จะลองหา httpx2 ก่อนแล้วค่อย fallback มาใช้ httpx ปกติ
# เราเลือก httpx เพราะเป็นแพ็กเกจที่ใช้กันแพร่หลายและตรวจสอบที่มาได้ชัดเจนกว่า
dev = ["pytest>=8.0", "pytest-cov>=4.1", "ruff>=0.3", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sunseg"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
filterwarnings = [
    # starlette เตือนว่าควรย้ายไป httpx2 — เราเลือกใช้ httpx โดยตั้งใจ (ดูหมายเหตุด้านบน)
    # ไม่ระบุคลาสเพราะ starlette ใช้คลาสของตัวเอง (StarletteDeprecationWarning)
    "ignore:Using `httpx` with `starlette.testclient`",
    "ignore::UserWarning:sunpy",
]
