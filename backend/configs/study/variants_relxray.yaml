# แบบเพิ่มเติมสำหรับทดสอบ X-ray แบบสัมพัทธ์ (xray_log10_rel27d) — แยกไฟล์จาก
# study/variants.yaml เพราะคอลัมน์นี้มีเฉพาะใน pool ที่สร้างใหม่
# (data/processed/study_sequences_cv_relx) ถ้าใส่ในไฟล์หลัก scripts/study/train.py จะหาคอลัมน์ไม่เจอ
# ตอนรันกับ pool เดิม (ตรวจชื่อคอลัมน์ของทุกแบบในไฟล์ก่อนเทรน)
#
# V0/V2/V3 นิยามเหมือนในไฟล์หลักทุกประการ ใส่ไว้เพื่อเทียบในรายงานเดียวกันแบบจับคู่ fold/seed
#
# **เพิ่มหลังเห็นผล** ว่า V3 แพ้ V0 เพราะ X-ray สัมบูรณ์เลื่อนระดับข้ามปี (val 2014 -> test 2015
# ต่ำลง 0.96 SD) จนทำให้ threshold ที่เลือกบน val ใช้กับ test ไม่ได้ จึงเป็นการสำรวจ ไม่ใช่
# สิ่งที่ spec กำหนดไว้ก่อน

sharp_columns: &sharp
  - TOTUSJH
  - TOTPOT
  - TOTUSJZ
  - ABSNJZH
  - SAVNCPP
  - USFLUX
  - AREA_ACR
  - MEANPOT
  - R_VALUE
  - SHRGT45
  - MEANSHR
  - MEANGAM
  - MEANGBT
  - MEANGBZ
  - MEANGBH
  - MEANJZH
  - MEANJZD
  - MEANALP

intensity_columns: &intensity
  - 4500_p95
  - 304_p95
  - 171_p95

xray_columns: &xray
  - xray_log10_median

xray_relative_columns: &xray_rel
  - xray_log10_rel27d

variants:
  V0:
    label: "18 SHARP (control)"
    role: "control — ชุดเดียวกับโมเดลที่ระบบใช้ผลิตอยู่"
    columns: *sharp

  V2:
    label: "18 SHARP + X-ray"
    role: "X-ray สัมบูรณ์ — ตัวเทียบของ V6"
    columns:
      - *sharp
      - *xray

  V3:
    label: "18 SHARP + intensity + X-ray"
    role: "X-ray สัมบูรณ์ + intensity — ตัวเทียบของ V7"
    columns:
      - *sharp
      - *intensity
      - *xray

  V6:
    label: "18 SHARP + X-ray สัมพัทธ์"
    role: >-
      สมมติฐาน (เขียนก่อนเห็นผล): ตัดโทษจาก threshold ที่ย้ายข้ามปีไม่ได้ออก จึงควรดีกว่า V2
      และได้ใกล้ V0 แต่ไม่น่าชนะ V0 เพราะยังเป็นค่าทั้งดวงที่แยก AR ไม่ได้
    columns:
      - *sharp
      - *xray_rel

  V7:
    label: "18 SHARP + intensity + X-ray สัมพัทธ์"
    role: "สมมติฐานเดียวกับ V6 — เทียบกับ V3 ตรงๆ"
    columns:
      - *sharp
      - *intensity
      - *xray_rel
