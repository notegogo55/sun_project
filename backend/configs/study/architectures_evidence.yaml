# สถาปัตยกรรมของงาน feature-evidence-cv (.scratch/feature-evidence-cv/spec.md หัวข้อ 5)
#
# LSTM ตัวเดียว ค่า **คัดลอกตรงตัว** จาก block `lstm` ของ configs/study/architectures.yaml (ค้นหาบน V0
# เมื่อ 2026-09-22) — ไม่ค้นหาใหม่ · แยกไฟล์เพราะ train.py รันเฉพาะแบบที่สถาปัตยกรรมประกาศไว้ และแบบของ
# งานนี้ (VH, VI, VHI) ไม่อยู่ในรายชื่อของไฟล์หลัก · test_study_architectures ยืนยันว่าค่าตรงกับไฟล์หลัก

default_variants: [V0, VH, VI]

architectures:
  lstm:
    model:
      kind: lstm
      hidden_size: 32
      num_layers: 1
      dropout: 0.48500392500755257
      pooling: last
    train:
      lr: 0.0027102898128767237
      weight_decay: 0.0037122126477891282
      early_stop_patience: 12
    loss:
      focal_alpha: 0.6801825577397586
      focal_gamma: 1.8924473440526008
    variants: [V0, VH, VI, V1, V2, VHI]
