# แบบของงาน feature-evidence-cv — นิยามล็อกไว้ใน .scratch/feature-evidence-cv/spec.md หัวข้อ 4
# (เขียน 2026-09-23 ก่อนเห็นผลใด ๆ ของ feature ใหม่) ห้ามแก้หลังเริ่มเทรน
#
# ใช้กับ pool data/processed/study_sequences_evidence เท่านั้น (สร้างด้วย study/build_dataset.py
# --flares-path data/interim/flares_v2.parquet --extra-aia-channels 94,131 --flare-history --no-split)
# — pool เดิมไม่มีคอลัมน์ 94_*/131_*/ar_flare_* ซึ่ง train.py ตรวจชื่อคอลัมน์ของทุกแบบก่อนเทรนอยู่แล้ว
#
# หลัก: VH (H1) และ VI (H2) เทียบกับ V0 — ปรับ Holm สองสมมติฐาน
# รอง (สำรวจ): V1, V2, VHI

sharp_columns: &sharp
  - TOTUSJH
  - TOTPOT
  - TOTUSJZ
  - ABSNJZH
  - SAVNCPP
  - USFLUX
  - AREA_ACR
  - MEANPOT
  - R_VALUE
  - SHRGT45
  - MEANSHR
  - MEANGAM
  - MEANGBT
  - MEANGBZ
  - MEANGBH
  - MEANJZH
  - MEANJZD
  - MEANALP

flare_history_columns: &history
  - ar_flare_log10max_12h
  - ar_flare_count_c_12h

hot_intensity_columns: &hot
  - 94_p95
  - 131_p95

old_intensity_columns: &old_intensity
  - 4500_p95
  - 304_p95
  - 171_p95

variants:
  V0:
    label: "18 SHARP (control)"
    role: "control"
    columns: *sharp

  VH:
    label: "18 SHARP + ประวัติ flare ของ AR"
    role: "H1 (หลัก) — X-ray ที่ระบุได้ว่ามาจาก AR ไหน ต่างจาก X-ray ทั้งดวง"
    columns:
      - *sharp
      - *history

  VI:
    label: "18 SHARP + AIA 94/131"
    role: "H2 (หลัก) — โคโรนาร้อนที่ magnetogram ไม่เห็น"
    columns:
      - *sharp
      - *hot

  V1:
    label: "18 SHARP + intensity 4500/304/171"
    role: "รอง — คำถามเดิมของ V1 ด้วย CV ที่มี power มากขึ้นและ label ฉบับแก้"
    columns:
      - *sharp
      - *old_intensity

  V2:
    label: "18 SHARP + X-ray ทั้งดวง"
    role: "รอง — V2 เดิม"
    columns:
      - *sharp
      - xray_log10_median

  VHI:
    label: "18 SHARP + ประวัติ flare + AIA 94/131"
    role: "รอง — สองกลุ่มใหม่รวมกัน"
    columns:
      - *sharp
      - *history
      - *hot
