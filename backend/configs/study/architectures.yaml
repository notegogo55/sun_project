# แกน "สถาปัตยกรรม" ของงานเปรียบเทียบ — คู่กับ study/variants.yaml ที่เป็นแกน "แบบ"
#
# ตารางหลักคือ (สถาปัตยกรรมที่ไม่ใช่ supplementary) x default_variants = 4 x 4 = 16 เซลล์
# ซึ่งถูกจัดอันดับด้วย TSS เฉลี่ยบน test เพื่อหาเซลล์ที่ดีที่สุด (คำถามหลักตั้งแต่ 2026-09-24)
# แบบที่เกินจาก default_variants และรายการที่ supplementary: true เป็นแถวเสริมใต้ตาราง
# ไม่ถูกจัดอันดับและไม่ถูกนำไปคิด Δ ของตารางหลัก
#
# **ค่าของสี่สถาปัตยกรรมหลักมาจากการค้นหาจริง (2026-09-22)** ด้วย
# backend/scripts/study/tune.py งบเท่ากันทุกตัว: 40 trial x 3 seed x 2 fold
# ค้นหาบนแบบ V0 เท่านั้น objective = mean(val TSS) - 0.5 x SD และไม่มีเส้นทางใดอ่าน test
# (ดู docs/adr/0001-tune-per-architecture.md) — ผลดิบอยู่ที่ artifacts/architecture_tuning/
#
#   สถาปัตยกรรม   objective   val TSS           พารามิเตอร์   เวลาค้นหา
#   tcn           0.7886      0.7937 +- 0.0101      6,409      0.63 ชม.
#   transformer   0.7663      0.7737 +- 0.0149      5,097      0.64 ชม.
#   darnn         0.7548      0.7646 +- 0.0198      2,809      1.11 ชม.
#   lstm          0.7429      0.7561 +- 0.0264      7,265      0.45 ชม.
#
# ตัวเลขข้างบนวัดบน fold ที่ train เพียง 1-3 ปี ส่วนตารางหลัก train 13 ปี — อันดับนี้จึง
# **ยังไม่ใช่ข้อสรุป** ต้องผ่านด่านตรวจการถ่ายทอดใน ticket 02 ก่อน
#
# ค่าที่ไม่อยู่ใน train:/loss: ของแต่ละตัว ตกทอดมาจากค่าร่วมของ configs/forecast.yaml ทั้งหมด
# (batch_size, scheduler, warmup_epochs, grad_clip, eval) — จงใจไม่เปิดให้ทับ เพราะ
# ต้องเหมือนกันทุกแถว ไม่งั้นแยกไม่ออกว่าผลต่างมาจากสถาปัตยกรรมหรือจากตารางการเทรน

# เรียงตามเลข ID (ผู้ใช้กำหนด 2026-09-24 ให้ตรงกันทุกที่ทั้งตาราง รูป และรายงาน):
# SHARP ล้วน -> +intensity -> +X-ray -> +ทั้งสอง · สองคอลัมน์กลาง (V1, V2) เพิ่มคนละหนึ่งกลุ่ม feature
# จาก V0 เดียวกัน ไม่ใช่การเติมสะสม
# (ลำดับเดิม V0, V2, V1, V3 วางตามตรรกะการเติม feature — ตัวเลขไม่เปลี่ยน เปลี่ยนแค่ลำดับคอลัมน์)
default_variants: [V0, V1, V2, V3]

architectures:
  # ------------------------------------------------------------------ #
  # แถวของตารางหลัก
  # ------------------------------------------------------------------ #

  lstm:
    # สถาปัตยกรรมอ้างอิงของ Δ ในภาคผนวก — anchor คือเซลล์ (lstm, V0)
    #
    # V4/V5 พ่วงมาด้วยเพราะเป็นแถวเสริมที่รายงานต้องมี: V5 คือ activity baseline
    # ที่ตอบว่าทักษะ 0.74 ไม่ได้มาจากการรู้ระดับความคึกของดวงอาทิตย์เฉย ๆ (test TSS 0.083)
    # ส่วน V4 ตอบว่าการไม่ใช้ SHARP เลยให้ผลแค่ไหน
    # (V1 ย้ายขึ้นไปเป็นคอลัมน์ของตารางหลักแล้ว ไม่ใช่แถวเสริมอีกต่อไป)
    #
    # การค้นหาเลือก pooling: last (เป็นครั้งที่สองที่การค้นหาทิ้ง attention โดยอิสระ และรอบนี้
    # ขอบเขตกว้างกว่าเดิมเพราะมี mean ให้เลือกด้วย) ตั้งแต่ 2026-09-23 models.lstm ของ
    # configs/forecast.yaml ใช้ค่าชุดนี้ด้วย — ค่าตั้งมือเดิมของระบบคือแถวเสริม lstm_production
    model:
      kind: lstm
      hidden_size: 32
      num_layers: 1
      dropout: 0.48500392500755257
      pooling: last
    train:
      lr: 0.0027102898128767237
      weight_decay: 0.0037122126477891282
      early_stop_patience: 12
    loss:
      focal_alpha: 0.6801825577397586
      focal_gamma: 1.8924473440526008
    # ลำดับในช่องนี้ไม่มีผล — บอกแค่ว่าสถาปัตยกรรมนี้ต้องรัน variant ไหนบ้าง
    # ลำดับคอลัมน์ของตารางมาจาก default_variants ด้านบนอย่างเดียว
    # LSTM รันครบทุกตัวที่มีใน study/variants.yaml (สี่ตัวแรกเป็นคอลัมน์ของตาราง V4/V5 เป็นแถวเสริม)
    variants: [V0, V1, V2, V3, V4, V5]

  tcn:
    # ค่าจาก **การค้นหารอบสอง** (artifacts/architecture_tuning/tcn.db — ผลดิบรอบแรกลบแล้ว) ตามกฎที่ประกาศไว้
    # ใน ADR 0001 ว่าจะใช้รอบสองแทนรอบแรก ไม่ใช่หยิบตัวที่ดีกว่าระหว่างสองรอบ
    #
    # รอบแรกได้ objective 0.7886 (6,409 พารามิเตอร์, channels 24) ส่วนรอบสองได้ 0.7652
    # (16,121 พารามิเตอร์, channels 40) — **ทั้งสองรอบเลือกรูปทรง k2_d5 เหมือนกัน** ทั้งที่
    # รอบสองมีรูปทรงที่เล็กกว่าให้เลือก ผลต่าง 0.023 จึงเป็น noise ของการค้นหาล้วน ๆ
    # ไม่ใช่ผลของการแก้ขอบเขต ดูข้อจำกัดที่ตามมาใน ADR 0001
    model:
      kind: tcn
      channels: 40
      kernel_size: 2
      dilations: [1, 2, 4, 8, 16]
      dropout: 0.26517281758017786
      pooling: last
    train:
      lr: 0.001395584029600283
      weight_decay: 0.00011061847364452465
      early_stop_patience: 8
    loss:
      focal_alpha: 0.742274823007715
      focal_gamma: 2.722897537233276

  transformer:
    model:
      kind: transformer
      d_model: 24
      n_heads: 2
      ff_dim: 32
      n_layers: 1
      dropout: 0.40462009893098894
      pooling: last
    train:
      lr: 0.0014496902855057323
      weight_decay: 0.00023663069738689616
      early_stop_patience: 16
    loss:
      focal_alpha: 0.7408902499005017
      focal_gamma: 1.9432196813817826

  darnn:
    model:
      kind: darnn
      hidden_size: 16
      dropout: 0.293185262892693
      pooling: last
    train:
      lr: 0.0016779945998788236
      weight_decay: 0.0033860939038207424
      early_stop_patience: 12
    loss:
      focal_alpha: 0.6876676105573225
      focal_gamma: 1.3076934839011818

  # ------------------------------------------------------------------ #
  # แถวเสริมใต้ตาราง
  # ------------------------------------------------------------------ #

  lstm_production:
    # LSTM ด้วย hyperparameter ชุดตั้งมือที่ระบบเคยใช้ผลิตจนถึง 2026-09-23 — **ไม่ถูก tune**
    # (ชื่อ lstm_production คงไว้เพราะเป็นชื่อไฟล์ของ run ทั้ง 100 ตัวใน artifacts/model_comparison)
    #
    # ตั้งแต่ 2026-09-23 models.lstm ใน configs/forecast.yaml ใช้ค่าเดียวกับ anchor (lstm ด้านบน)
    # แถวนี้จึงตอบคำถาม "ค่าตั้งต้นก่อนค้นหาอยู่ตรงไหนของตาราง" แทน — ค่าข้างล่างตรึงไว้ตรงนี้
    # ไม่อ่านจาก forecast.yaml เพื่อให้ signature ของ run เดิมยังตรงกัน
    # ดู docs/adr/0001-tune-per-architecture.md
    model: {kind: lstm, hidden_size: 32, num_layers: 1, dropout: 0.4, pooling: attention}
    train: {lr: 5.0e-4, weight_decay: 1.0e-3, early_stop_patience: 12}
    loss: {focal_alpha: 0.75, focal_gamma: 2.0}
    label: "LSTM (untuned)"
    supplementary: true
