# U-Net สำหรับ segment active region จาก full-disk magnetogram

model:
  in_channels: 1
  out_channels: 1
  base_channels: 32         # ถ้า OOM บน 4GB ให้ลดเป็น 16
  depth: 4                  # 32/64/128/256 + bottleneck 512
  norm: batch
  bilinear_upsample: true   # ประหยัด VRAM กว่า ConvTranspose2d

data:
  image_size: 512
  # magnetogram มี dynamic range กว้างมาก (+-3000 G) — บีบด้วย tanh(B/scale)
  # โดยยังคงเครื่องหมายขั้วแม่เหล็กไว้
  norm_scale_gauss: 300.0

train:
  epochs: 80
  batch_size: 4             # VRAM 4GB
  grad_accum_steps: 4       # effective batch = 16
  lr: 3.0e-4
  weight_decay: 1.0e-4
  amp: true                 # ประหยัด VRAM เป็นหลัก (Turing GTX16xx ไม่มี Tensor Core)
  grad_clip: 1.0
  early_stop_patience: 15
  scheduler: cosine
  warmup_epochs: 3
  num_workers: 2            # ลดจาก 4: เครื่องมี RAM แค่ 16GB และมีโปรแกรมอื่นแย่งใช้อยู่มาก
  seed: 42

loss:
  # AR ครอบคลุมเพียง ~1-3% ของ pixel บนจาน จึงต้องถ่วงน้ำหนักหนัก
  bce_weight: 0.5
  dice_weight: 0.5
  pos_weight: 20.0

augment:
  hflip: true
  vflip: true
  rotate_deg: 15.0
  intensity_jitter: 0.1
  # ห้าม flip เครื่องหมายของ B — ขั้วแม่เหล็กมีความหมายทางฟิสิกส์
  allow_polarity_flip: false

eval:
  threshold: 0.5
  object_iou_threshold: 0.3   # เกณฑ์นับว่า AR หนึ่งดวงถูก detect สำเร็จ
