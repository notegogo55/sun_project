# รัน webapp ด้วย Docker — backend กับ frontend เป็นคนละ container ชัดเจน:
#
#     docker compose up --build
#
# เปิด http://localhost:3000  (frontend — nginx proxy /api ไปที่ backend ให้เอง)
# เอกสาร API อยู่ที่ http://localhost:8000/docs (backend โดยตรง)
#
# หมายเหตุ: ต้องเทรนโมเดลบนเครื่องที่มี GPU ก่อน (ดู README) โมเดลและข้อมูลถูก
# mount เข้า backend แบบอ่านอย่างเดียว ทำให้เปลี่ยนโมเดลได้โดยไม่ต้อง build image ใหม่

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sunseg-backend
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts:ro
      - ./data:/app/data:ro
    environment:
      # เส้นทางภายใน container — ต้องตรงกับที่ mount ไว้ข้างบน
      - PYTHONUTF8=1
    restart: unless-stopped

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    container_name: sunseg-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
