# เสิร์ฟ React build ที่ root แล้ว proxy /api, /docs, /openapi.json ไปยัง backend
# container (ชื่อ service "backend" — resolve ผ่าน Docker network) — ทำให้ browser
# มองเห็นเป็น origin เดียวกันเสมอ ไม่ต้องตั้ง CORS ฝั่ง FastAPI

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs {
        proxy_pass http://backend:8000;
    }

    location /openapi.json {
        proxy_pass http://backend:8000;
    }

    # single-page app: เส้นทางที่ไม่ match ไฟล์จริง (เช่น deep link) ให้ตกกลับไปที่ index.html
    location / {
        try_files $uri /index.html;
    }
}
