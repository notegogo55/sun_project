<!-- ชุดฟอนต์ตามธีม space-weather: Orbitron (หัวข้อ/ตัวเลข), Rajdhani (เนื้อความละติน),

<!-- โหลด Plotly จาก CDN แทนที่จะ npm install แล้ว bundle เข้าไป — ตัว lib เต็มหนักหลาย MB

     ปักเวอร์ชันตรงนี้แทน ทุก component เรียกผ่าน global `window.Plotly` (ดู PlotlyChart.jsx,
     DiskChart.jsx) -->
